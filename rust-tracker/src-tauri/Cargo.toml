[package]
name = "dota-tracker"
version = "0.2.0"
edition = "2021"
description = "Native desktop Dota 2 live match tracker built on Valve's official Game State Integration (GSI) feed."

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "5"
tiny_http = "0.12"

[profile.release]
opt-level = 2
