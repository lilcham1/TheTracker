<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tracker Overlay</title>
  <link rel="stylesheet" href="overlay.css" />
</head>
<body>
  <div id="overlay" class="overlay">
    <div class="ov-head">
      <span class="ov-dot" id="ovDot"></span>
      <span class="ov-title" id="ovTitle">Waiting for a match</span>
      <span class="ov-clock" id="ovClock"></span>
    </div>
    <div id="ovBody" class="ov-body"></div>
  </div>
  <script src="overlay.js"></script>
</body>
</html>
