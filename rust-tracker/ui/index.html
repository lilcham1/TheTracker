<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TheTracker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app" class="shell">

    <aside class="sidebar">
      <div class="brand">
        <img class="brand-mark" src="brand.png" alt="" />
        <div class="brand-text">
          <span class="brand-name">The<b>Tracker</b></span>
          <span class="brand-sub">Match Intelligence</span>
        </div>
      </div>

      <nav class="nav" id="nav">
        <div class="nav-group">
          <span class="nav-group-label">Dota 2</span>
          <button class="nav-item active" data-view="live">
            <span class="nav-ico live-ico"></span><span class="nav-label">Live</span><span class="nav-badge" id="liveBadge" hidden></span>
          </button>
          <button class="nav-item" data-view="dotamatches"><span class="nav-ico">▤</span><span class="nav-label">Match History</span></button>
          <button class="nav-item" data-view="history"><span class="nav-ico">◷</span><span class="nav-label">Tracked Sessions</span></button>
          <button class="nav-item" data-view="leaderboard"><span class="nav-ico">▲</span><span class="nav-label">Leaderboard</span></button>
        </div>

        <div class="nav-group">
          <span class="nav-group-label">Deadlock</span>
          <button class="nav-item" data-view="dloverview"><span class="nav-ico">◆</span><span class="nav-label">Overview</span></button>
          <button class="nav-item" data-view="dlmatches"><span class="nav-ico">▤</span><span class="nav-label">Matches</span></button>
          <button class="nav-item" data-view="dlheroes"><span class="nav-ico">✦</span><span class="nav-label">Heroes</span></button>
        </div>

        <div class="nav-group">
          <span class="nav-group-label">Settings</span>
          <button class="nav-item" data-view="profile"><span class="nav-ico">◎</span><span class="nav-label">Profile</span></button>
          <button class="nav-item" data-view="accounts"><span class="nav-ico">⚿</span><span class="nav-label">Accounts</span></button>
        </div>
      </nav>

      <div class="sidebar-foot">
        <button class="ghost-btn" id="overlayBtn" type="button">
          <span class="nav-ico">▣</span><span class="ghost-label">Overlay</span>
        </button>
        <div class="sync-pill" id="syncPill">
          <span class="sync-dot"></span><span class="sync-label" id="syncText">Local only</span>
        </div>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <div class="topbar-left">
          <h1 class="view-title" id="viewTitle">Live</h1>
          <span class="view-sub" id="viewSub"></span>
        </div>
        <div class="topbar-right">
          <div id="serverError" class="pill pill-error" hidden></div>
          <button class="pill pill-toggle" id="trackingToggle" type="button">
            <span class="dot"></span><span class="label">Tracking</span>
          </button>
          <div class="user-chip" id="userChip">
            <div class="user-avatar" id="userAvatar"></div>
            <div class="user-meta">
              <span class="user-name" id="userName">Signed out</span>
              <span class="user-rank" id="userRank"></span>
            </div>
          </div>
        </div>
      </header>

      <main class="content" id="content">
        <section id="tab-live" class="view active"></section>
        <section id="tab-dotamatches" class="view"></section>
        <section id="tab-history" class="view"></section>
        <section id="tab-leaderboard" class="view"></section>

        <section id="tab-dloverview" class="view"></section>
        <section id="tab-dlmatches" class="view"></section>
        <section id="tab-dlheroes" class="view"></section>

        <section id="tab-profile" class="view"></section>
        <section id="tab-accounts" class="view"></section>
      </main>
    </div>
  </div>

  <script src="app.js"></script>
  <script src="deadlock.js"></script>
  <script src="dotamatches.js"></script>
  <script src="boot.js"></script>
</body>
</html>
