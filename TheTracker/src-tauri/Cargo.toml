[package]
name = "thetracker"
version = "0.13.0"
edition = "2021"
description = "TheTracker — desktop match tracker for Dota 2 and Deadlock."

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "5"
tiny_http = "0.12"
# Cloud sync — see convex_sync.rs. anyhow comes along because the convex
# client's methods return anyhow::Result.
convex = "0.10"
anyhow = "1"
tokio = { version = "1", features = ["sync"] }
uuid = { version = "1", features = ["v4"] }
# Deadlock data comes from the community REST API (see deadlock.rs) — there
# is no official Valve feed for it the way Dota has GSI.
reqwest = { version = "0.12", features = ["json"] }

# In-app updates. Desktop only — there is no mobile build.
[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2"

# Reads only the Steam account id / display name from the registry.
# See steam.rs for exactly what is and is not read.
[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[dev-dependencies]
# The Deadlock integration tests are async and hit the live community API.
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[profile.release]
opt-level = 2
