<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TheTracker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app" class="shell">

    <header class="topbar">
      <div class="brand">
        <img class="brand-mark" src="brand.png" alt="" />
        <span class="brand-name">The<b>Tracker</b></span>
      </div>

      <!-- Game tabs: the primary split in the app. -->
      <nav class="game-tabs" id="gameTabs">
        <button class="game-tab active" data-game="dota" type="button">Dota 2</button>
        <button class="game-tab" data-game="deadlock" type="button">Deadlock</button>
      </nav>

      <div class="topbar-right">
        <div id="serverError" class="pill pill-error" hidden></div>
        <button class="top-action" id="refreshViewBtn" type="button" title="Refresh the current page">
          <span class="nav-ico" data-icon="refresh"></span><span>Refresh</span>
        </button>
        <button class="pill pill-toggle" id="trackingToggle" type="button">
          <span class="dot"></span><span class="label">Tracking</span>
        </button>
        <button class="pill pill-toggle" id="overlayBtn" type="button">
          <span class="nav-ico" data-icon="overlay"></span><span class="ghost-label">Overlay</span>
        </button>

        <!-- App-level settings live here rather than in the sidebar. The
             sidebar belongs to whichever game is selected; these three pages
             belong to neither, and repeating them under both read as though
             each game had its own copy. -->
        <div class="appmenu-wrap">
          <button class="pill pill-toggle" id="appMenuBtn" type="button" aria-haspopup="true" aria-expanded="false" title="App settings">
            <span class="nav-ico" data-icon="settings"></span><span class="ghost-label">Settings</span>
          </button>
          <div class="appmenu" id="appMenu" hidden>
            <button class="appmenu-item" data-view="overlaysettings" type="button">
              <span class="nav-ico" data-icon="overlay"></span><span>Overlay Settings</span>
            </button>
            <button class="appmenu-item" data-view="accounts" type="button">
              <span class="nav-ico" data-icon="profile"></span><span>Account</span>
            </button>
            <button class="appmenu-item" data-view="about" type="button">
              <span class="nav-ico" data-icon="about"></span><span>About &amp; Updates</span>
            </button>
          </div>
        </div>

        <div class="user-chip" id="userChip">
          <div class="user-avatar" id="userAvatar"></div>
          <div class="user-meta">
            <span class="user-name" id="userName">Signed out</span>
            <span class="user-rank" id="userRank"></span>
          </div>
        </div>
      </div>
    </header>

    <div class="body">
      <aside class="sidebar">
        <nav class="nav" id="nav">
          <div class="nav-group" data-game-group="dota">
            <span class="nav-group-label">Dota 2</span>
            <button class="nav-item active" data-view="dotaoverview"><span class="nav-ico" data-icon="overview"></span><span class="nav-label">Overview</span></button>
            <button class="nav-item" data-view="live">
              <span class="nav-ico live-ico"></span><span class="nav-label">Live</span>
            </button>
            <button class="nav-item" data-view="dotamatches"><span class="nav-ico" data-icon="matches"></span><span class="nav-label">Match History</span></button>
            <button class="nav-item" data-view="dotameta"><span class="nav-ico" data-icon="meta"></span><span class="nav-label">Meta</span></button>
            <button class="nav-item" data-view="dotaheroes"><span class="nav-ico" data-icon="heroes"></span><span class="nav-label">Heroes</span></button>
            <button class="nav-item" data-view="favorite"><span class="nav-ico" data-icon="star"></span><span class="nav-label">Hero Focus</span></button>
            <button class="nav-item" data-view="builds"><span class="nav-ico" data-icon="builds"></span><span class="nav-label">Builds</span></button>
            <button class="nav-item" data-view="history"><span class="nav-ico" data-icon="sessions"></span><span class="nav-label">Sessions</span></button>
            <button class="nav-item" data-view="leaderboard"><span class="nav-ico" data-icon="leaderboard"></span><span class="nav-label">Leaderboard</span></button>
          </div>

          <div class="nav-group" data-game-group="deadlock" hidden>
            <span class="nav-group-label">Deadlock</span>
            <button class="nav-item" data-view="dloverview"><span class="nav-ico" data-icon="overview"></span><span class="nav-label">Overview</span></button>
            <button class="nav-item" data-view="dlmatches"><span class="nav-ico" data-icon="matches"></span><span class="nav-label">Matches</span></button>
            <button class="nav-item" data-view="dlmeta"><span class="nav-ico" data-icon="meta"></span><span class="nav-label">Meta</span></button>
            <button class="nav-item" data-view="dlheroes"><span class="nav-ico" data-icon="heroes"></span><span class="nav-label">Heroes</span></button>
            <button class="nav-item" data-view="dlfavorite"><span class="nav-ico" data-icon="star"></span><span class="nav-label">Hero Focus</span></button>
            <button class="nav-item" data-view="dlbuilds"><span class="nav-ico" data-icon="builds"></span><span class="nav-label">Builds</span></button>
          </div>

        </nav>

        <div class="sidebar-foot">
          <div class="sync-pill" id="syncPill">
            <span class="sync-dot"></span><span class="sync-label" id="syncText">Local only</span>
          </div>
        </div>
      </aside>

      <div class="main">
        <div class="upd-banner" id="updateBanner" hidden></div>

        <div class="view-head">
          <h1 class="view-title" id="viewTitle">Live</h1>
          <span class="view-sub" id="viewSub"></span>
        </div>

        <main class="content" id="content">
          <section id="tab-dotaoverview" class="view active"></section>
          <section id="tab-live" class="view"></section>
          <section id="tab-dotamatches" class="view"></section>
          <section id="tab-dotameta" class="view"></section>
          <section id="tab-dotaheroes" class="view"></section>
          <section id="tab-favorite" class="view"></section>
          <section id="tab-builds" class="view"></section>
          <section id="tab-history" class="view"></section>
          <section id="tab-leaderboard" class="view"></section>

          <section id="tab-dloverview" class="view"></section>
          <section id="tab-dlmatches" class="view"></section>
          <section id="tab-dlmeta" class="view"></section>
          <section id="tab-dlheroes" class="view"></section>
          <section id="tab-dlfavorite" class="view"></section>
          <section id="tab-dlbuilds" class="view"></section>

          <section id="tab-overlaysettings" class="view"></section>
          <section id="tab-accounts" class="view"></section>
          <section id="tab-about" class="view"></section>
        </main>
      </div>
    </div>
  </div>

  <script src="icons.js"></script>
  <script src="app.js"></script>
  <script src="home.js"></script>
  <script src="updates.js"></script>
  <script src="deadlock.js"></script>
  <script src="dotamatches.js"></script>
  <script src="heroes.js"></script>
  <script src="builds.js"></script>
  <script src="popular.js"></script>
  <script src="dlextras.js"></script>
  <script src="overlaysettings.js"></script>
  <script src="meta.js"></script>
  <script src="boot.js"></script>
</body>
</html>
