<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>TheTracker Overlay</title>
  <style>
    html, body { margin: 0; background: transparent; overflow: hidden; user-select: none; }
    body { font-family: Bahnschrift, "Segoe UI", sans-serif; color: #f2f4f7; }
    #chips { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; padding: 6px; transform-origin: top left; }
    /* Three fixed places: "next up", the rings (their row's height kept
       even when empty), then one message. In a bottom corner the order
       flips so "next up" stays at the screen's edge. */
    body.bottom #chips { flex-direction: column-reverse; }
    .slot { display: flex; flex-direction: column; align-items: inherit; }
    .slot-next { min-height: 34px; justify-content: center; }
    .slot-next.off { display: none; }
    .slot-rings { min-height: 76px; }
    body.compact .slot-rings { min-height: 56px; }
    .slot-msg:empty, .slot-next:empty { visibility: hidden; }
    body.preview .slot-rings { min-height: 0; }
    body.right #chips { align-items: flex-end; transform-origin: top right; }
    body.bottom { display: flex; flex-direction: column; justify-content: flex-end; height: 100vh; }
    body.bottom #chips { transform-origin: bottom left; }
    body.bottom.right #chips { transform-origin: bottom right; }
    /* In Settings the sample always sits at the top left of its frame. */
    body.preview, body.preview.bottom { display: block; height: auto; }
    body.preview #chips { align-items: flex-start; transform-origin: top left; }

    /* Rings side by side, soonest first, four to a row. */
    .rings { display: flex; flex-wrap: nowrap; gap: 6px 4px; max-width: 292px; }
    body.right .rings { justify-content: flex-end; }
    body.preview .rings { justify-content: flex-start; }

    /* Each reminder is a cooldown ring in its own colour (--c): the ring
       empties clockwise as the warning runs out, the seconds sit on the
       game's picture of the rune, the name sits underneath. */
    .ring { display: flex; flex-direction: column; align-items: center; gap: 3px; width: 70px; }
    .ring.compact { width: 54px; }
    .dial { position: relative; display: grid; place-items: center; width: 54px; height: 54px; border-radius: 50%;
      background: radial-gradient(circle, rgba(16, 19, 26, .9) 55%, rgba(10, 12, 17, .94));
      box-shadow: 0 3px 12px rgba(0, 0, 0, .5); }
    .dial > * { grid-area: 1 / 1; }
    .arc { width: 54px; height: 54px; overflow: visible; }
    .arc circle { fill: none; stroke-width: 4; }
    .arc .track { stroke: color-mix(in srgb, var(--c) 18%, rgba(255, 255, 255, .06)); }
    /* Drawn from twelve o'clock anticlockwise, so the gap grows clockwise. */
    .arc .fill { stroke: var(--c); stroke-linecap: round; transform: rotate(90deg) scaleX(-1); transform-origin: 32px 32px;
      filter: drop-shadow(0 0 3px color-mix(in srgb, var(--c) 60%, transparent)); }
    /* The picture, dimmed under the number like an ability on cooldown. */
    .art { width: 32px; height: 32px; object-fit: contain; filter: brightness(.6) saturate(.9); }
    .art.item { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; }
    .art.icon { width: 24px; height: 24px; color: var(--c); filter: none; opacity: .55; }
    .secs { position: relative; z-index: 1; font-size: 23px; line-height: 1; font-weight: 700; font-variant-numeric: tabular-nums; color: rgba(255, 255, 255, .92);
      text-shadow: 0 0 3px #000, 0 1px 3px #000, 0 0 8px rgba(0, 0, 0, .8); }
    .name { max-width: 100%; font-size: 11.5px; font-weight: 600; letter-spacing: .01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      text-align: center; color: rgba(242, 244, 247, .88); text-shadow: 0 1px 2px #000, 0 0 4px rgba(0, 0, 0, .8); }

    /* The last three seconds: a thicker ring and a brighter number. */
    .ring.soon .arc circle { stroke-width: 6; }
    .ring.soon .secs { color: #fff; text-shadow: 0 0 3px #000, 0 1px 3px #000, 0 0 12px var(--c); }
    .ring.soon .art { filter: brightness(.75); }

    /* It has happened: the disc fills with its colour and the picture comes
       up to full size and brightness, one pulse, then gone. */
    .ring.is-now .dial { background: radial-gradient(circle, color-mix(in srgb, var(--c) 55%, rgba(10, 12, 17, .9)) 40%, color-mix(in srgb, var(--c) 30%, rgba(10, 12, 17, .94)));
      animation: pulse .65s ease-out 3; }
    .ring.is-now .art { width: 40px; height: 40px; filter: drop-shadow(0 0 6px color-mix(in srgb, var(--c) 80%, transparent)); }
    .ring.is-now .art.item { width: 42px; height: 42px; }
    .ring.is-now .art.icon { width: 28px; height: 28px; opacity: 1; color: #0a0c11; }
    .ring.is-now .name { color: var(--c); }
    /* Counting down: the ring glows on and off in its colour and the name
       lights up with it, so it's caught from the corner of the eye; twice
       as fast in the last three seconds. */
    .ring.flash .dial { animation: flash .8s ease-in-out infinite alternate; }
    .ring.flash .name { animation: flash-name .8s ease-in-out infinite alternate; }
    .ring.flash.soon .dial, .ring.flash.soon .name { animation-duration: .4s; }
    @keyframes flash {
      from { box-shadow: 0 3px 12px rgba(0, 0, 0, .5), 0 0 0 0 transparent; }
      to { box-shadow: 0 3px 12px rgba(0, 0, 0, .5), 0 0 0 4px color-mix(in srgb, var(--c) 90%, transparent), 0 0 20px 6px color-mix(in srgb, var(--c) 65%, transparent); }
    }
    @keyframes flash-name { from { color: rgba(242, 244, 247, .88); } to { color: var(--c); } }
    @keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--c) 75%, transparent); } 100% { box-shadow: 0 0 0 14px transparent; } }

    /* At 10:00 and 20:00: how the goals due then went. */
    .goalcheck { margin-top: 6px; max-width: 320px; padding: 8px 12px 9px; border-radius: 9px; background: rgba(10, 12, 17, .88);
      border-left: 3px solid #f0b54a; box-shadow: 0 3px 12px rgba(0, 0, 0, .45); font-size: 14px; }
    .card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 14px; font-size: 15px; }
    .goalcheck .card-head b { color: #f0c46a; }
    .goalcheck ul { margin: 6px 0 0; padding-left: 0; list-style: none; }
    .goalcheck li { margin: 3px 0; }
    .goalcheck li::before { content: "✓ "; color: #7ec46a; font-weight: 700; }
    .goalcheck li.missed::before { content: "✗ "; color: #ff6b6b; }

    /* Next up: one quiet line, not a reminder. */
    .next { display: flex; gap: 10px; padding: 5px 8px; border-radius: 8px; background: rgba(10, 12, 17, .8); font-size: 20px; color: rgba(242, 244, 247, .85); white-space: nowrap; }
    .next span { display: inline-flex; align-items: center; gap: 8px; padding: 2px 8px; border-radius: 6px; }
    .next i { width: 11px; height: 11px; border-radius: 50%; background: var(--c); }
    /* Close to its time: the entry lights up in its colour, on and off. */
    .next span.flash { animation: next-flash .8s ease-in-out infinite alternate; }
    @keyframes next-flash {
      from { background: transparent; box-shadow: none; }
      to { background: color-mix(in srgb, var(--c) 32%, transparent); box-shadow: 0 0 0 2px var(--c), 0 0 14px 2px color-mix(in srgb, var(--c) 55%, transparent); color: #fff; }
    }
    .next b { font-weight: 600; color: #f2f4f7; font-variant-numeric: tabular-nums; }

    @media (prefers-reduced-motion: reduce) { .ring.is-now .dial { animation: none; } }
  </style>
</head>
<body>
  <div id="chips"></div>
  <script src="js/shell.js"></script>
  <script src="js/overlay.js"></script>
</body>
</html>
