<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TheTracker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="shell" id="shell" data-game="dota">
    <aside class="side">
      <div class="brand">
        <img src="brand.png" alt="" />
        <span>TheTracker</span>
      </div>

      <button class="nav-item today-btn" id="todayBtn" data-act="go" data-view="today" type="button">
        <span class="ico" data-ico="today"></span><span>Today</span>
      </button>
      <button class="search-btn" data-act="pal-open" type="button" title="Search pages and heroes"><span class="ico" data-ico="search"></span><span class="grow">Search</span><kbd>Ctrl K</kbd></button>

      <div class="games" id="games" role="tablist" aria-label="Game"></div>

      <nav class="nav" id="nav" aria-label="Pages"></nav>

      <div class="side-foot">
        <button class="nav-item" data-act="go" data-view="settings" type="button">
          <span class="ico" data-ico="settings"></span><span>Settings</span>
        </button>
        <div class="status-line" id="syncLine" title=""></div>
      </div>
    </aside>

    <div class="main">
      <header class="top">
        <div class="top-title">
          <h1 id="viewTitle"></h1>
          <p id="viewSub"></p>
        </div>
        <div class="top-actions">
          <button class="pill" id="dotaPill" data-act="go" data-view="overview" type="button" title="">
            <span class="dot"></span><span id="dotaPillText">Dota</span>
          </button>
          <button class="pill" id="trackPill" data-act="toggle-tracking" type="button" title="Pause or resume recording matches">
            <span class="dot"></span><span id="trackPillText">Recording</span>
          </button>
          <button class="pill" id="overlayPill" data-act="toggle-overlay" type="button" title="Show or hide the in-game overlay">
            <span class="ico" data-ico="overlay"></span><span>Overlay</span>
          </button>
          <button class="pill" data-act="refresh" id="refreshBtn" type="button" title="Reload this page's data (F5)">
            <span class="ico" data-ico="refresh"></span><span>Refresh</span>
          </button>
        </div>
      </header>

      <div class="banners" id="banners"></div>
      <main class="page" id="page" tabindex="-1"></main>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <div class="palette" id="palette" hidden>
    <div class="pal-back" data-act="pal-close"></div>
    <div class="pal-box" role="dialog" aria-label="Search">
      <input class="pal-input" id="palInput" type="text" placeholder="Go to a page or hero…" autocomplete="off" spellcheck="false" />
      <div class="pal-list" id="palList"></div>
      <div class="pal-foot muted"><span><kbd>↑</kbd><kbd>↓</kbd> choose</span><span><kbd>Enter</kbd> open</span><span><kbd>Ctrl 1–4</kbd> games</span><span><kbd>Ctrl T</kbd> today</span><span><kbd>Esc</kbd> close</span></div>
    </div>
  </div>

  <script src="js/shell.js"></script>
  <script src="js/core.js"></script>
  <script src="js/dota.js"></script>
  <script src="js/dota-extra.js"></script>
  <script src="js/deadlock.js"></script>
  <script src="js/cs2.js"></script>
  <script src="js/overwatch.js"></script>
  <script src="js/today.js"></script>
  <script src="js/compare.js"></script>
  <script src="js/share.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/palette.js"></script>
  <script src="js/boot.js"></script>
</body>
</html>
